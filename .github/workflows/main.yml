name: Build Mirage

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Mirage-${{ runner.os }}
          path: |
            build/Mirage_artefacts/Release/VST3
            build/Mirage_artefacts/Release/AU
            build/Mirage_artefacts/Release/CLAP
          if-no-files-found: warn
